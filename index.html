const defaults=()=>({schema:3,createdAt:dateNow(),updatedAt:dateNow(),settings:{currency:'INR',startYear:2027,endYear:2031,weekStarts:'Monday',theme:'light',dashboardWidgets:['career','health','finance','habits','goals'],dailyTargetStudy:90,stepsTarget:8000,waterTarget:2.5,sleepTarget:8,monthlyBudget:30000},daily:[],goals:[],projects:[],tasks:[],skills:[],learning:[],workouts:[],body:[],habits:[{id:uid(),name:'Meditation',unit:'minutes',target:10,area:'Mind',active:true},{id:uid(),name:'Study',unit:'minutes',target:90,area:'Career',active:true},{id:uid(),name:'Walk',unit:'steps',target:8000,area:'Health',active:true},{id:uid(),name:'Read',unit:'minutes',target:15,area:'Mind',active:true}],habitLogs:[],transactions:[],accounts:[{id:uid(),name:'Primary account',type:'Bank',opening:0}],budgets:[],savings:[],debts:[],journal:[],reviews:[],lifeEvents:[],customMetrics:[],customValues:[],careerMilestones:[],communicationLogs:[]});
let state=loadState(),page='dashboard',syncTimer=null,syncBusy=false,msalApp=null,account=null,cryptoKey=null,cloudSalt=null,cloudEtag=null,syncState='Not connected';
function migrateLegacy(x){let d=defaults();if(!x||!Array.isArray(x.entries)||!Array.isArray(x.goals))return d;d.daily=x.entries.map(e=>({date:e.date,mood:0,energy:0,focus:n(e.focus),sleep:n(e.sleep),study:n(e.study),deepWork:0,steps:n(e.steps),water:0,meditation:n(e.meditation),reading:0,screenTime:0,calories:n(e.calories),protein:n(e.protein),weight:n(e.weight),waist:n(e.waist),workout:!!e.workout,activity:e.exercise||'',reflection:e.reflection||'',notes:e.notes||'',updatedAt:e._updatedAt||dateNow()}));d.goals=x.goals.map(g=>({...g,progress:g.progress??(n(g.target)?Math.round(n(g.current)/n(g.target)*100):0),status:g.status||'Active'}));d.skills=Array.isArray(x.skills)?x.skills:[];d.settings={...d.settings,...(x.settings||{})};return d}

function dashboardPage(){let d=state.daily.filter(x=>x.date>=new Date(Date.now()-29*864e5).toISOString().slice(0,10));let inc=state.transactions.filter(x=>inMonth(x.date)&&x.type==='Income').reduce((a,x)=>a+n(x.amount),0),out=state.transactions.filter(x=>inMonth(x.date)&&x.type==='Expense').reduce((a,x)=>a+n(x.amount),0);let study=sum(d,'study'),w=d.filter(x=>x.workout).length,goalDone=state.goals.filter(x=>x.status==='Done').length;let recent=[...state.daily].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);let due=state.tasks.filter(x=>x.status!=='Done').slice(0,5);return `${head('YOUR PERSONAL OPERATING SYSTEM','Design your days. Measure your growth.','A connected view of your career, health, money, mindset and relationships.',btn('＋ Daily check-in',"go('daily')",'primary'))}<div class="grid kpis">${kpi('Study · last 30 days',fmt(study/60,1)+'h',d.length+' daily records','⌘')}${kpi('Workout days · 30 days',w,'Logged sessions','♡')}${kpi('Income · this month',money(inc),'Recorded income','↗')}${kpi('Expenses · this month',money(out),'Recorded expenses','↘')}</div><div class="grid two"><div class="card">${card('Growth pulse','Last 30 days')}<div class="list"><div class="listrow"><span>Learning time</span><b>${fmt(study/60,1)} hours</b></div><div class="listrow"><span>Meditation</span><b>${fmt(sum(d,'meditation'))} min</b></div><div class="listrow"><span>Average sleep</span><b>${fmt(d.length?sum(d,'sleep')/d.length:0,1)} h</b></div><div class="listrow"><span>Average steps</span><b>${fmt(d.length?sum(d,'steps')/d.length:0)} / day</b></div><div class="listrow"><span>Goals completed</span><b>${goalDone} / ${state.goals.length}</b></div></div></div><div class="card">${card('Money snapshot','This month')}<div class="kpi-value">${money(inc-out)}</div><div class="kpi-foot">Net cash flow · income minus expenses</div><div class="list section"><div class="listrow"><span>Income</span><b class="positive">${money(inc)}</b></div><div class="listrow"><span>Expenses</span><b cl function lifePage(){return `${head('LIFE OUTSIDE WORK','Life & relationships','Make room for family, friendships, experiences, contribution and personal milestones.',btn('＋ Add event','addLifeEvent()','primary'))}<div class="grid two"><div class="card">${card('Important events','Dates and memories')}${state.lifeEvents.length?state.lifeEvents.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="listrow"><div><b>${e.date} · ${esc(e.title)}</b><div class="muted small">${esc(e.category||'Personal')} · ${esc(e.notes||'')}</div></div></div>`).join(''):empty('Add birthdays, travel, family events, volunteering and milestones.')}</div><div class="card">${card('Life balance check','Monthly reflection')}<p>Are you making time for:</p><ul><li>Family and close relationships?</li><li>Rest, play and meaningful experiences?</li><li>Learning and career development?</li><li>Physical and mental wellbeing?</li><li>Financial stability and generosity?</li></ul></div></div>`}function addLifeEvent(){modalForm('Life event',[['Date','date',today(),'date'],['Title','title','','text'],['Category','category','Family'],['Notes','notes','','textarea']],v=>{state.lifeEvents.push({id:uid(),...v});persist();render()})}
function reviewsPage(){return `${head('CLOSE THE LOOP','Reviews & routines','Use weekly and monthly reviews to turn tracking into decisions.',btn('＋ Save review','addReview()','primary'))}<div class="grid two"><div class="card">${card('Weekly review','Suggested every Sunday')}<ol><li>What were my three wins?</li><li>What did I avoid or postpone?</li><li>How did my health, money and relationships fare?</li><li>What did I learn?</li><li>What are next week’s three priorities?</li></ol></div><div class="card">${card('Monthly review','Suggested at month-end')}<ol><li>Review income, expenses, savings and debt.</li><li>Review goals and projects.</li><li>Check health trends and consistency.</li><li>Review learning and career evidence.</li><li>Choose one adjustment for next month.</li></ol></div></div><div class="card section">${card('Saved reviews','Your review history')}${state.reviews.length?state.reviews.slice().reverse().map(r=>`<div class="listrow"><div><b>${r.date} · ${esc(r.type)}</b><div class="muted small">${esc(r.wins||'').slice(0,180)}</div></div></div>`).join(''):empty('Save your first weekly or monthly review.')}</div>`}function addReview(){modalForm('Review',[['Date','date',today(),'date'],['Type','type','Weekly','select:Weekly,Monthly,Quarterly,Annual'],['Wins','wins','','textarea'],['Challenges','challenges','','textarea'],['Lessons','lessons','','textarea'],['Next priorities','priorities','','textarea']],v=>{state.reviews.push({id:uid(),...v});persist();render()})}
function analyticsPage(){let months={};state.transactions.forEach(t=>{let m=t.date.slice(0,7);months[m]??={income:0,expense:0};if(t.type==='Income')months[m].income+=n(t.amount);if(t.type==='Expense')months[m].expense+=n(t.amount)});let daily=state.daily.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);return `${head('MEASURE WHAT MATTERS','Analytics & trends','Review your data over time. Export it whenever you need deeper analysis.')}<div class="grid two"><div class="card">${card('Financial monthly summary','Recorded cash flow')}${Object.keys(months).length?`<div class="tablewrap"><table><thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr></thead><tbody>${Object.keys(months).sort().reverse().map(m=>`<tr><td>${m}</td><td class="positive">${money(months[m].income)}</td><td class="negative">${money(months[m].expense)}</td><td>${money(months[m].income-months[m].expense)}</td></tr>`).join('')}</tbody></table></div>`:empty('Add transactions to build financial reports.')}</div><div class="card">${card('Daily consistency','Recent activity')}${daily.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Study</th><th>Sleep</th><th>Steps</th><th>Weight</th></tr></thead><tbody>${daily.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${n(x.study)}m</td><td>${n(x.sleep)}h</td><td>${n(x.steps)}</td><td>${n(x.weight)||'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('Log daily data to see trends.')}</div></div><div class="card section">${card('Export analysis','CSV exports')}${btn('Export transactions CSV','exportTransactions()')}${btn('Export daily metrics CSV','exportDaily()')}${btn('Export all data JSON','exportBackup()')}</div>`}
function customPage(){return `${head('MAKE IT YOURS','Customise GrowthOS','Adjust targets, habits, currency and metrics to match your priorities.')}<div class="grid two"><div class="card">${card('Personal settings','Targets and preferences')}<div class="formgrid">${field('Currency (ISO code)','sCurrency','text',state.settings.currency)}${field('Steps target / day','sSteps','number',state.settings.stepsTarget)}${field('Study target (minutes/day)','sStudy','number',state.settings.dailyTargetStudy)}${field('Water target (litres/day)','sWater','number',state.settings.waterTarget)}${field('Sleep target (hours)','sSleep','number',state.settings.sleepTarget)}${field('Plan start year','sStart','number',state.settings.startYear)}${field('Plan end year','sEnd','number',state.settings.endYear)}</div><div class="actions">${btn('Save settings','saveSettings()','primary')}</div></div><div class="card">${card('Custom daily metrics','Track anything you care about')}${btn('＋ Add custom metric','addMetric()','sm')}${state.customMetrics.map(m=>`<div class="listrow"><span><b>${esc(m.name)}</b><div class="muted small">${esc(m.area)} · ${esc(m.unit)}</div></span>${btn('Delete',`deleteMetric('${m.id}')`,'sm danger')}</div>`).join('')||empty('Examples: English practice, coding problems, cigarettes, reading pages, social time.')}</div></div><div class="card section">${card('Habit library','Build routines that matter')}${btn('＋ Add habit','addHabit()','sm')}${state.habits.map(h=>`<div class="listrow"><div><b>${esc(h.name)}</b><div class="muted small">${esc(h.area)} · target ${n(h.target)} ${esc(h.unit)}</div></div>${btn('Delete',`deleteHabit('${h.id}')`,'sm danger')}</div>`).join('')||empty('Add habits to track consistency.')}</div>`}function saveSettings(){Object.assign(state.settings,{currency:val('sCurrency').toUpperCase()||'INR',stepsTarget:n(val('sSteps')),dailyTargetStudy:n(val('sStudy')),waterTarget:n(val('sWater')),sleepTarget:n(val('sSleep')),startYear:n(val('sStart')),endYear:n(val('sEnd'))});persist();toast('Settings saved');render()}function addMetric(){modalForm('Custom metric',[['Name','name','','text'],['Unit','unit','minutes'],['Growth area','area','Personal']],v=>{state.customMetrics.push({id:uid(),...v});persist();render()})}function deleteMetric(id){if(confirm('Delete this custom metric and its recorded values?')){state.customMetrics=state.customMetrics.filter(x=>x.id!==id);state.customValues=state.customValues.filter(x=>x.metricId!==id);persist();render()}}function addHabit(){modalForm('Habit',[['Name','name','','text'],['Unit','unit','minutes'],['Target','target',1,'number'],['Area','area','Personal']],v=>{state.habits.push({id:uid(),...v,target:n(v.target),active:true});persist();render()})}function deleteHabit(id){if(confirm('Delete this habit?')){state.habits=state.habits.filter(x=>x.id!==id);state.habitLogs=state.habitLogs.filter(x=>x.habitId!==id);persist();render()}}
function dataPage(){return `${head('SETUP & PRIVACY','Sync & data','Website preview status and safe next steps.')}<div class="notice warn"><b>OneDrive is not connected.</b> We will configure Microsoft sign-in for your personal Microsoft account after the website has its final HTTPS address. No public IP or purchased domain is required.</div><div class="grid two"><div class="card">${card('Current website status','Preview build')}<p><b>Website:</b> Ready for GitHub Pages publishing.</p><p><b>Personal Microsoft account:</b> Selected for the future sign-in setup.</p><p><b>OneDrive sync:</b> Not configured or tested.</p><p><b>Local encryption:</b> Not implemented for the browser database yet.</p><p class="muted small">Please use sample information only. Do not enter real journal entries, financial records, passwords, health details or other sensitive information.</p></div><div class="card">${card('Backup & portability','Export your preview data')}<p class="muted small">You can export sample data for testing. Keep backups private and do not upload them to a public repository.</p><div class="actions">${btn('Download JSON backup','exportBackup()','primary')}${btn('Export daily CSV','exportDaily()')}${btn('Export finance CSV','exportTransactions()')}</div><p class="muted small">Before production, we will implement encrypted local storage, secure authentication, conflict-safe OneDrive sync and recovery testing.</p></div></div><div class="card section">${card('Next implementation milestones','Website first')}<ol><li>Publish this preview to a free HTTPS GitHub Pages address.</li><li>Register a Microsoft application for personal accounts and configure the exact redirect URI.</li><li>Replace plaintext browser persistence with encrypted local storage.</li><li>Implement OneDrive app-folder sync, version checks and conflict recovery.</li><li>Test on Windows and Android, then complete independent security testing.</li></ol></div>`}function saveConfig(){let id=val('clientId').trim();if(!/^[0-9a-fA-F-]{36}$/.test(id))return alert('Enter a valid Microsoft Entra client ID.');localStorage.setItem(CFGKEY,JSON.stringify({clientId:id,authority:val('authority')}));toast('Microsoft configuration saved');}
function getCfg(){try{let c=JSON.parse(localStorage.getItem(CFGKEY)||'null');if(c)return c;let old=JSON.parse(localStorage.getItem('growthos_onedrive_config_v1')||'null');if(old){localStorage.setItem(CFGKEY,JSON.stringify(old));return old}return {}}catch(e){return {}}}function setSync(s){syncState=s;let e=document.getElementById('syncText');if(e)e.textContent=s;updateSyncBadge()}function updateSyncBadge(){let e=document.getElementById('syncBadge'),f=document.getElementById('sideSync');if(e)e.textContent=account?(cryptoKey?'OneDrive connected':'OneDrive · locked'):'Local mode';if(f)f.textContent=account?syncState:'Your data stays in this browser until you connect OneDrive.'}
async function ensureMsal(){let c=getCfg();if(!c.clientId)throw Error('Save the Microsoft client ID first.');if(!window.msal)throw Error('Microsoft sign-in library did not load. Check internet access.');if(!msalApp){msalApp=new msal.PublicClientApplication({auth:{clientId:c.clientId,authority:'https://login.microsoftonline.com/'+(c.authority||'common'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});await msalApp.initialize();let r=await msalApp.handleRedirectPromise();account=r?.account||msalApp.getAllAccounts()[0]||null;}return msalApp}
async function connectDrive(){try{let app=await ensureMsal();if(!account){let r=await app.loginPopup({scopes:['User.Read','Files.ReadWrite.AppFolder']});account=r.account;}setSync('Connected as '+(account.username||account.name)+'. Unlock encryption to sync.');toast('Microsoft account connected');if(cryptoKey)await syncNow()}catch(e){setSync('Sign-in failed: '+e.message);alert(e.message)}}
async function token(){let app=await ensureMsal();if(!account)throw Error('Sign in to OneDrive first.');try{return (await app.acquireTokenSilent({scopes:['User.Read','Files.ReadWrite.AppFolder'],account})).accessToken}catch(e){return (await app.acquireTokenPopup({scopes:['User.Read','Files.ReadWrite.AppFolder'],account})).accessToken}}
async function graph(path,opts={}){let t=await token(),r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opts,headers:{Authorization:'Bearer '+t,...(opts.headers||{})}});if(r.status===404)return null;if(!r.ok){let body=await r.text();let er=Error('Microsoft Graph '+r.status+': '+body.slice(0,180));er.status=r.status;throw er}return r}
function b64(a){let s='';new Uint8Array(a).forEach(x=>s+=String.fromCharCode(x));return btoa(s)}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function readCloud(){let meta=await graph('/me/drive/special/approot:/growthos-v3.enc?$select=id,eTag');if(!meta){cloudEtag=null;return null}let m=await meta.json();cloudEtag=m.eTag||null;let r=await graph('/me/drive/special/approot:/growthos-v3.enc:/content');if(!r)return null;return await r.json()}
async function unlockEncryption(){let p=val('pass1'),p2=val('pass2');if(p.length<12)return alert('Use at least 12 characters.');try{if(!crypto.subtle)throw Error('HTTPS or localhost is required for encryption.');let remote=account?await readCloud():null;if(remote){cloudSalt=unb64(remote.salt);if(p2&&p!==p2)throw Error('Passphrases do not match.');}else{if(p!==p2)throw Error('Passphrases do not match.');cloudSalt=crypto.getRandomValues(new Uint8Array(16));}let mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);cryptoKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:cloudSalt,iterations:310000,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);if(remote){let decrypted=await decryptPayload(remote);state=decrypted;localStorage.setItem(DBKEY,JSON.stringify(state));setSync('Encrypted cloud snapshot downloaded and unlocked.');}else setSync('Encryption initialised.');document.getElementById('cryptoText').textContent='Encryption unlocked on this device.';toast('Encryption unlocked');render();if(account&&!remote)await syncNow()}catch(e){cryptoKey=null;alert('Could not unlock encryption: '+e.message);setSync('Encryption error: '+e.message)}}
function lockEncryption(){cryptoKey=null;document.getElementById('cryptoText')&&(document.getElementById('cryptoText').textContent='Encryption locked.');setSync('Encryption locked.');toast('Encryption locked')}
async function encryptPayload(obj){let iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(JSON.stringify(obj)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,plain);return {format:'GrowthOS-Encrypted-v3',algorithm:'AES-GCM-256',kdf:'PBKDF2-SHA256',iterations:310000,salt:b64(cloudSalt),iv:b64(iv),ciphertext:b64(cipher),updatedAt:dateNow(),schema:3}}
async function decryptPayload(x){let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},cryptoKey,unb64(x.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
async function syncNow(){if(syncBusy)return;if(!account)return setSync('Not connected.');if(!cryptoKey)return setSync('Connected, but encryption is locked.');syncBusy=true;try{setSync('Checking OneDrive…');let remote=await readCloud();if(remote){let cloudState=await decryptPayload(remote);if(state.updatedAt>cloudState.updatedAt){let payload=await encryptPayload(state);await putCloud(payload,cloudEtag);setSync('Synced to OneDrive at '+new Date().toLocaleTimeString());}else{state=cloudState;localStorage.setItem(DBKEY,JSON.stringify(state));setSync('Downloaded latest OneDrive data at '+new Date().toLocaleTimeString());render();}}else{let payload=await encryptPayload(state);await putCloud(payload,null);setSync('First encrypted snapshot uploaded.');}toast('OneDrive sync complete')}catch(e){if(e.status===412){setSync('Sync conflict: OneDrive changed elsewhere. Download latest cloud data before making more edits.');}else setSync('Sync error: '+e.message);console.error(e)}finally{syncBusy=false;updateSyncBadge()}}
async function putCloud(payload,etag){let headers={'Content-Type':'application/json'};if(etag)headers['If-Match']=etag;else headers['If-None-Match']='*';await graph('/me/drive/special/approot:/growthos-v3.enc:/content',{method:'PUT',headers,body:JSON.stringify(payload)});cloudEtag=null;}
async function pullLatest(){if(!account||!cryptoKey)return alert('Connect OneDrive and unlock encryption first.');if(!confirm('Download and replace local data with the latest OneDrive snapshot? Export a local backup first if you have unsynced changes.'))return;try{let remote=await readCloud();if(!remote)return toast('No cloud snapshot exists yet.');state=await decryptPayload(remote);localStorage.setItem(DBKEY,JSON.stringify(state));setSync('Latest cloud copy downloaded.');render();toast('Latest OneDrive copy loaded')}catch(e){setSync('Download failed: '+e.message);alert(e.message)}}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1800)}window.addEventListener('online',()=>{if(account&&cryptoKey)syncNow()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&account&&cryptoKey)syncNow()});
function modalForm(title,fields,done){let html=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>${title}</h3><button class="btn sm" onclick="closeModal()">✕</button></div><div class="formgrid">`;fields.forEach(([label,id,value,type='text'])=>{if(type==='textarea')html+=`<div class="field full"><label>${label}</label><textarea id="mf_${id}">${esc(value)}</textarea></div>`;else if(type.startsWith('select:'))html+=`<div class="field"><label>${label}</label><select id="mf_${id}">${type.slice(7).split(',').map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select></div>`;else html+=`<div class="field"><label>${label}</label><input id="mf_${id}" type="${type}" value="${esc(value)}"></div>`});html+=`</div><div class="actions"><button class="btn primary" id="modalSave">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`;document.getElementById('modal').innerHTML=html;document.getElementById('modalback').classList.add('show');document.getElementById('modalSave').onclick=()=>{let v={};fields.forEach(([l,id])=>v[id]=document.getElementById('mf_'+id).value);done(v);closeModal();toast(title+' saved')}}function closeModal(){document.getElementById('modalback').classList.remove('show')}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportBackup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'growthos-backup-'+today()+'.json');toast('Backup exported')}function csv(rows,cols,name){let lines=[cols.join(','),...rows.map(r=>cols.map(k=>{let v=r[k]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(','))];download(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),name)}function exportDaily(){csv(state.daily,['date','mood','energy','focus','sleep','study','deepWork','steps','water','meditation','reading','screenTime','calories','protein','weight','waist','workout','activity'],'growthos-daily-'+today()+'.csv')}function exportTransactions(){csv(state.transactions,['date','type','amount','category','account','description'],'growthos-transactions-'+today()+'.csv')}
function importBackup(){let f=document.getElementById('importFile').files[0];if(!f)return toast('Choose a JSON file');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let imported;if(x.schema&&Array.isArray(x.daily))imported={...defaults(),...x};else if(Array.isArray(x.entries)&&Array.isArray(x.goals))imported=migrateLegacy(x);else throw Error('Not a GrowthOS backup');if(!confirm('Replace current GrowthOS data with this backup? Export your current data first.'))return;state=imported;persist();render();toast('Backup imported')}catch(e){alert('Import failed: '+e.message)}};r.readAsText(f)}
function init(){if(!localStorage.getItem(DBKEY))persist();render();updateSyncBadge();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
init();
// Lightweight self-tests for key invariants. Run with ?test=1 and inspect console.
function runTests(){let results=[];const test=(name,fn)=>{try{if(!fn())throw Error('assertion failed');results.push({name,ok:true})}catch(e){results.push({name,ok:false,error:e.message})}};test('Default state contains all core domains',()=>['daily','goals','skills','transactions','accounts','journal','habits','reviews'].every(k=>Array.isArray(defaults()[k])));test('Currency formatter returns a string',()=>typeof money(1250)==='string');test('Month filter matches current month',()=>inMonth(today()));test('Unique IDs differ',()=>uid()!==uid());test('Legacy v2 migration preserves study data',()=>migrateLegacy({entries:[{date:'2026-01-01',study:45}],goals:[]}).daily[0].study===45);test('Account balance includes recorded income and expenses',()=>{let old=state.transactions;state.transactions=[{account:'Test',type:'Income',amount:100},{account:'Test',type:'Expense',amount:50}];let v=accountBalance({name:'Test',opening:100});state.transactions=old;return v===150});test('CSV escaping handles quotes',()=>('"a""b"'===('"'+'a"b'.replace(/"/g,'""')+'"')));test('Encryption primitives available on secure context',()=>!crypto.subtle||typeof crypto.subtle.encrypt==='function');console.table(results);if(results.some(x=>!x.ok))throw Error('GrowthOS self-tests failed');return results}if(new URLSearchParams(location.search).has('test'))runTests();
</script></body></html>
